name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build web app and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      # SOLUCIÓN: Instalamos Gradle directamente en el servidor
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2' # Versión estable y compatible con Capacitor 6

      - name: Build Android APK
        working-directory: android
        # Usamos gradle directo, sin el ./gradlew que causaba el error
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnackyMusic-APK
          # PREVENCIÓN: Usamos comodines para que encuentre el APK sin importar la ruta exacta
          path: android/app/build/outputs/apk/**/*.apk